# Recording and replay QoS (./ironlark run --record, check-replay): reliable, and deep enough that a
# recorder falling behind a 500 Hz clock beside megabyte images loses nothing.
/clock: {history: keep_last, depth: 20000, reliability: reliable, durability: volatile}
/imu/data: {history: keep_last, depth: 10000, reliability: reliable, durability: volatile}
/lidar/points: {history: keep_last, depth: 200, reliability: reliable, durability: volatile}
/camera/image_raw: {history: keep_last, depth: 200, reliability: reliable, durability: volatile}
/camera/camera_info: {history: keep_last, depth: 200, reliability: reliable, durability: volatile}
/tf_static: {history: keep_last, depth: 1, reliability: reliable, durability: transient_local}
